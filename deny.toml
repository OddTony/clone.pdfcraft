# cargo-deny policy (M0.4). Run with `cargo xtask deny`; part of `cargo xtask ci`.
# Code dependencies follow the same rule as assets (AGENTS.md): permissive licences only.
# Copyleft (GPL, AGPL, LGPL) is never linked; such tools run only as external oracle processes.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Weak (file-level) copyleft, not GPL/AGPL/LGPL: only modifications to MPL-covered files
    # themselves must be shared, not the combined/linked application. Needed for `uniffi` and its
    # generated bindings, used by the iOS companion app's Rust FFI bridge.
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared UI components; Cargo.toml pins the immutable revision.
allow-git = ["https://github.com/storytold/craft-libs"]

[advisories]
yanked = "warn"
ignore = [
    # Marvin (RSA private-key timing side channel, no fixed `rsa` release). pdfcraft-sign uses
    # `rsa` only for public-key signature verification, which the advisory does not affect; RSA
    # private-key operations use aws-lc-rs on native targets and are refused in the browser
    # (ADR-0009). Revisit when a fixed `rsa` ships.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for verification only (ADR-0009)" },
    # bincode 1.3.3, pulled in transitively by `uniffi` (iOS FFI bridge): archived, not a
    # vulnerability. Revisit when uniffi migrates off bincode 1.x.
    { id = "RUSTSEC-2025-0141", reason = "transitive dep of uniffi; no vulnerability, just archived" },
    # paste 1.0.15, pulled in transitively by `uniffi`: archived proc-macro helper, not a
    # vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep of uniffi; no vulnerability, just archived" },
]

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences on the AGENTS.md
# §1.2 allowlist, attributed in ATTRIBUTION.toml as dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
