[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
pdfcraft-oracle = { workspace = true }
pdfcraft-cos = { workspace = true }
anyhow = "1"
lopdf = "0.45"
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Safe nonblocking IO, pidfd exit notifications and owned-process cleanup for the opt-in check.
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
signal-hook = { version = "0.3.18", default-features = false }
