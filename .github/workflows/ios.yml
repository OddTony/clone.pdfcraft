# iOS companion app: build the Rust FFI crate for the Simulator, generate the
# Xcode project, and build the app. Simulator-only, unsigned — see ios/README.md
# for scope. There is no local macOS available for this project, so this
# workflow is the only way to validate iOS changes.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - apps/pdfcraft-mobile-ffi/**
      - ios/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/pdfcraft-mobile-ffi/**
      - ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-ffi
          workspaces: apps/pdfcraft-mobile-ffi
      - name: Select latest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Rust staticlib and generate Swift bindings
        run: ./ios/Scripts/build-ffi.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select simulator destination
        id: destination
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; names = [d['name'] for r in devices.values() for d in r if d['name'].startswith('iPhone')]; print(sorted(names)[-1] if names else sys.exit('no available iPhone simulators found'))")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ios
        run: |
          xcodebuild build \
            -project ArtiPDF.xcodeproj \
            -scheme ArtiPDF \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Boot simulator, install app, capture screenshot
        working-directory: ios
        run: |
          set -euo pipefail
          device="${{ steps.destination.outputs.name }}"
          udid=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name']=='$device'))")
          echo "Booting $device ($udid)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          app_path=$(find build/Build/Products -maxdepth 2 -name "ArtiPDF.app" -print -quit)
          echo "App at $app_path"
          xcrun simctl install "$udid" "$app_path"
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_path/Info.plist")
          xcrun simctl launch "$udid" "$bundle_id"
          sleep 5
          mkdir -p screenshots
          xcrun simctl io "$udid" screenshot screenshots/artipdf-simulator.png
          xcrun simctl shutdown "$udid" || true
      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: artipdf-simulator-screenshot
          path: ios/screenshots/artipdf-simulator.png
      - name: Upload simulator app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ArtiPDF-simulator-app
          path: ios/build/Build/Products/*/ArtiPDF.app
