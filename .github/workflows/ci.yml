name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      # The craft-fonts build input (Japanese fonts): every build embeds it. See
      # craftrules standards/fonts.md.
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        run: cargo check -p pdfcraft-cli --no-default-features

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    name: fuzz (mutation, 15 min)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      - name: Fetch the pdf.js corpus (seeds)
        run: cargo xtask corpus
      - name: Fuzz
        run: cargo xtask fuzz --time 900 --seed ${{ github.run_number }}
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-out/findings
          if-no-files-found: ignore
